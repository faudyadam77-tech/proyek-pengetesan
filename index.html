<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Belajar Bahasa Arab - Alat Sekolah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #ff6b6b; font-size: 2.5em; margin-bottom: 10px; text-shadow: 3px 3px 0px #ffd93d; }
        h2 { color: #4ecdc4; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 1.2em; color: #555; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select {
            width: 100%; padding: 15px; font-size: 1.1em;
            border: 3px solid #4ecdc4; border-radius: 15px; font-family: inherit;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #ff6b6b; box-shadow: 0 0 10px rgba(255, 107, 107, 0.3); }
        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d); color: white;
            padding: 15px 40px; font-size: 1.3em; border: none; border-radius: 50px;
            cursor: pointer; font-family: inherit; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4); transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .materi-box { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; border-radius: 20px; margin: 20px 0; }
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .vocab-card {
            background: white; padding: 20px; border-radius: 15px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        .vocab-card:hover { transform: translateY(-5px); }
        
        /* Gaya untuk Gambar Kosakata */
        .vocab-img {
            width: 100%;
            height: 130px;
            object-fit: contain;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .vocab-card .arabic { font-size: 2em; color: #ff6b6b; margin-bottom: 5px; }
        .vocab-card .latin { font-size: 1.1em; color: #666; font-style: italic; margin-bottom: 5px; }
        .vocab-card .indonesian { font-size: 1.2em; color: #4ecdc4; font-weight: bold; }
        
        .quiz-section { margin-top: 30px; }
        .question {
            background: #fff5f5; padding: 20px; border-radius: 15px;
            margin-bottom: 20px; border-left: 5px solid #ff6b6b;
        }
        .question-text { font-size: 1.3em; color: #333; margin-bottom: 15px; font-weight: bold; }
        
        /* Opsi Jawaban */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            background: white; border-radius: 10px; cursor: pointer;
            border: 2px solid #ddd; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .option input[type="radio"] {
            position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
        }
        .option label {
            display: block; padding: 15px; cursor: pointer; font-size: 1.1em;
            width: 100%; height: 100%; box-sizing: border-box; user-select: none;
        }
        .option:hover { background: #f0f0f0; border-color: #4ecdc4; }
        
        /* Warna saat dipilih */
        .option.selected {
            background-color: #e0f7fa; border-color: #4ecdc4; border-width: 3px;
        }
        .option.selected label { font-weight: bold; color: #00796b; }

        .result-box {
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            padding: 30px; border-radius: 20px; text-align: center;
            margin-top: 30px; display: none;
        }
        .result-box h2 { color: white; font-size: 2.5em; margin-bottom: 20px; }
        .score { font-size: 4em; color: white; font-weight: bold; text-shadow: 3px 3px 0px rgba(0,0,0,0.2); }
        .emoji { font-size: 3em; margin: 20px 0; }
        .hidden { display: none !important; }
        .section-title {
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            padding: 15px; border-radius: 15px; margin: 20px 0; text-align: center; font-size: 1.5em;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bounce { animation: bounce 1s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="bounce"> Belajar Bahasa Arab 🎨</h1>
        <h2>Alat-Alat Sekolah (الأَدَوَاتُ الْمَدْرَسِيَّةَةُ)</h2>

        <!-- Form Data Siswa -->
        <div id="studentForm">
            <div class="section-title">✏️ Isi Data Diri</div>
            <div class="form-group">
                <label>👤 Nama Lengkap:</label>
                <input type="text" id="studentName" placeholder="Tulis namamu di sini..." required>
            </div>
            <div class="form-group">
                <label>🏫 Kelas:</label>
                <select id="studentClass" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="2A">Kelas 2A</option>
                    <option value="2B">Kelas 2B</option>
                </select>
            </div>
            <button class="btn" onclick="startLearning()">🚀 Mulai Belajar!</button>
        </div>

        <!-- Materi & Quiz -->
        <div id="learningSection" class="hidden">
            
            <!-- Bagian Materi -->
            <div id="materiSection">
                <div class="section-title"> Kosakata Baru</div>
                <div class="materi-box">
                    <div class="vocab-grid">
                        <div class="vocab-card">
                            <img src="https://cdn.jsdelivr.net/gh/faudyadam77-tech/Kumpulan-gambar@main/kapur.jpeg" alt="Kapur" class="vocab-img">
                            <div class="arabic">طَبَاشِيرٌ</div>
                            <div class="latin">Thabāshīrun</div>
                            <div class="indonesian">Kapur Tulis</div>
                        </div>
                        <div class="vocab-card">
                            <img src="https://cdn.jsdelivr.net/gh/faudyadam77-tech/Kumpulan-gambar@main/kotak-pensil.jpeg" alt="Kotak Pensil" class="vocab-img">
                            <div class="arabic">مِقْلَمَةٌ</div>
                            <div class="latin">Miqlamatun</div>
                            <div class="indonesian">Kotak Pensil</div>
                        </div>
                        <div class="vocab-card">
                            <img src="https://cdn.jsdelivr.net/gh/faudyadam77-tech/Kumpulan-gambar@main/tas-sekolah.jpeg" alt="Tas Sekolah" class="vocab-img">
                            <div class="arabic">حَقِيبَةٌ</div>
                            <div class="latin">aqībatun</div>
                            <div class="indonesian">Tas Sekolah</div>
                        </div>
                        <div class="vocab-card">
                            <img src="https://cdn.jsdelivr.net/gh/faudyadam77-tech/Kumpulan-gambar@main/tipx.jpeg" alt="Tip-X" class="vocab-img">
                            <div class="arabic">مِزْيَلٌ</div>
                            <div class="latin">Mizyalun</div>
                            <div class="indonesian">Tip-X</div>
                        </div>
                        <div class="vocab-card">
                            <img src="https://cdn.jsdelivr.net/gh/faudyadam77-tech/Kumpulan-gambar@main/jangka.jpeg" alt="Jangka" class="vocab-img">
                            <div class="arabic">فِرْجَارٌ</div>
                            <div class="latin">Firjārun</div>
                            <div class="indonesian">Jangka</div>
                        </div>
                    </div>
                </div>
                <div style="text-align: center; margin: 30px 0;">
                    <button class="btn" onclick="startQuiz()">📝 Mulai Mengerjakan Soal!</button>
                </div>
            </div>

            <!-- Bagian Soal -->
            <div id="quizContainer" class="hidden">
                <div class="section-title">📝 Soal Pilihan Ganda</div>
                <div class="quiz-section" id="quizSection"></div>
                <button class="btn" onclick="submitQuiz()" style="width: 100%; margin-top: 20px;">✅ Selesai & Lihat Nilai</button>
            </div>
        </div>

        <!-- Hasil Nilai -->
        <div id="resultSection" class="result-box">
            <h2>🎉 Hasil Nilai </h2>
            <div class="emoji" id="resultEmoji"></div>
            <div class="score" id="scoreDisplay"></div>
            <p style="color: white; font-size: 1.5em; margin-top: 20px;" id="resultMessage"></p>
            <p style="color: white; font-size: 1.2em; margin-top: 10px;" id="resultDetails"></p>
        </div>
    </div>

    <script>
        const questions = [
            { question: "طَبَاشِيْرٌ artinya adalah...", options: ["Tas Sekolah", "Kapur Tulis", "Kotak Pensil"], correct: 1 },
            { question: "Bahasa Arab dari 'Tas Sekolah' adalah...", options: ["حَقِيْبَةٌ", "مِقْلَمَةٌ", "فِرْجَارٌ"], correct: 0 },
            { question: "مِقْلَمَةٌ dibaca...", options: ["Miqlamatun", "Ḥaqībatun", "Firjārun"], correct: 0 },
            { question: "Alat untuk menggambar lingkaran dalam bahasa Arab disebut...", options: ["مِزْيَلٌ", "طَبَاشِيْرٌ", "فِرْجَارٌ"], correct: 2 },
            { question: "فِرْجَارٌ artinya adalah...", options: ["Jangka", "Tip-X", "Kapur Tulis"], correct: 0 },
            { question: "Cairan penghapus (Tip-X) dalam bahasa Arab adalah...", options: ["حَقِيْبَةٌ", "مِزْيَلٌ", "مِقْلَمَةٌ"], correct: 1 },
            { question: "حَقِيْبَةٌ dibaca...", options: ["Thabāshīrun", "Mizyalun", "Ḥaqībatun"], correct: 2 },
            { question: "Bahasa Arab dari kapur tulis adalah...", options: ["طَبَاشِيْرٌ", "فِرْجَارٌ", "مِزْيَلٌ"], correct: 0 },
            { question: "Alat untuk memasukkan pensil dan penggaris disebut...", options: ["حَقِيْبَةٌ", "مِقْلَمَةٌ", "طَبَاشِيْرٌ"], correct: 1 },
            { question: "Pasangan yang BENAR antara bahasa Arab dan artinya adalah...", options: ["مِزْيَلٌ = Tas Sekolah", "فِرْجَارٌ = Jangka", "طَبَاشِيْرٌ = Kotak Pensil"], correct: 1 }
        ];

        let studentData = { name: '', class: '' };

        function generateQuiz() {
            const quizSection = document.getElementById('quizSection');
            quizSection.innerHTML = '';
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, optIndex) => `
                            <div class="option" onclick="selectOption(this, 'q${index}', ${optIndex})">
                                <input type="radio" name="q${index}" id="q${index}_${optIndex}" value="${optIndex}">
                                <label for="q${index}_${optIndex}">${String.fromCharCode(65 + optIndex)}. ${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                `;
                quizSection.appendChild(questionDiv);
            });
        }

        function selectOption(element, groupName, value) {
            const allOptions = document.querySelectorAll(`input[name="${groupName}"]`);
            allOptions.forEach(radio => {
                radio.closest('.option').classList.remove('selected');
            });
            element.classList.add('selected');
            const radio = element.querySelector('input[type="radio"]');
            radio.checked = true;
        }

        function startLearning() {
            const name = document.getElementById('studentName').value.trim();
            const className = document.getElementById('studentClass').value;
            if (!name || !className) { alert('⚠️ Mohon isi nama dan kelas terlebih dahulu!'); return; }
            
            studentData.name = name;
            studentData.class = className;
            
            document.getElementById('studentForm').classList.add('hidden');
            document.getElementById('learningSection').classList.remove('hidden');
            document.getElementById('materiSection').classList.remove('hidden');
            document.getElementById('quizContainer').classList.add('hidden');
            
            generateQuiz();
            window.scrollTo(0, 0);
        }

        function startQuiz() {
            document.getElementById('materiSection').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function submitQuiz() {
            let correct = 0;
            let answered = 0;
            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    answered++;
                    if (parseInt(selected.value) === q.correct) correct++;
                }
            });

            if (answered < questions.length) {
                if (!confirm(`️ Kamu baru menjawab ${answered} dari ${questions.length} soal. Yakin ingin mengumpulkan?`)) return;
            }

            const score = (correct / questions.length) * 100;
            document.getElementById('learningSection').classList.add('hidden');
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('scoreDisplay').textContent = score.toFixed(0);

            let emoji, message;
            if (score >= 90) { emoji = '🌟🌟'; message = 'Luar Biasa! Sempurna!'; }
            else if (score >= 70) { emoji = '👏😊'; message = 'Bagus Sekali!'; }
            else if (score >= 60) { emoji = '🙂👍'; message = 'Cukup Baik!'; }
            else { emoji = '💪📚'; message = 'Terus Belajar Ya!'; }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultDetails').textContent = `Benar: ${correct} dari ${questions.length} soal`;

            sendToSpreadsheet(correct, score);
            window.scrollTo(0, 0);
        }

        function getFormattedTimestamp() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()} ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        function sendToSpreadsheet(correct, score) {
            // GANTI URL INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
            const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

            const data = {
                timestamp: getFormattedTimestamp(),
                name: studentData.name,
                class: studentData.class,
                correct: correct,
                total: questions.length,
                score: score.toFixed(0)
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
